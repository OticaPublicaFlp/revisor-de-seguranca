[project]
name = "revisor-de-seguranca"
version = "1.0.0"
description = "Revisor de segurança de código com IA (Claude): somente leitura, relatório no Telegram e aprovação para o Slack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "croniter>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
revisor = "reviewer.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewer*"]
